# Push a tag `v<version>` (the version in horizon_switcher/horizon-mod.toml and its Cargo.toml), or
# let bump-horizon.yml call it: tests and checks the mod against its pinned Horizon, then publishes a
# release with the .hmod, which "Add from GitHub" and `mods update-github` install.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      verified:
        description: "The caller already tested and checked this commit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag is the mod's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("horizon_switcher/horizon-mod.toml","rb"))["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG, but horizon-mod.toml says $version" >&2; exit 1
          fi

      - name: Test and check
        if: ${{ !inputs.verified }}
        run: |
          cargo test --locked
          python3 tools/verify.py

      - name: Package
        id: package
        run: |
          python3 tools/package.py | tee package.json
          echo "file=$(python3 -c 'import json; print(json.load(open("package.json"))["file"])')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(python3 -c 'import json; print(json.load(open("package.json"))["sha256"])')" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          horizon=$(python3 -c 'import tomllib; print(tomllib.load(open("horizon_switcher/horizon-mod.toml","rb"))["native"]["horizon"])')
          notes=$(printf 'Built for Horizon `%s`.\n\nInstall: Mods → Add from GitHub → `%s/%s`, or put the `.hmod` in your instance'"'"'s `horizon-native-mods/`.\n\nSHA-256: `%s`\n' \
            "$horizon" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${{ steps.package.outputs.sha256 }}")
          gh release create "$TAG" "${{ steps.package.outputs.file }}" \
            --title "Horizon Switcher $TAG" --notes "$notes"
