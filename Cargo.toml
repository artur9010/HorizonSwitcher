# Unit tests for the switcher's logic, without the game: `shim/` stands in for the parts of
# Horizon that horizon_switcher/src/switcher.rs uses. The mod itself is horizon_switcher/, which
# the Horizon launcher builds; this crate is not part of it.
[package]
name = "horizon-switcher-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "shim/lib.rs"

[dependencies]
serde_json = "1"
log = "0.4"
