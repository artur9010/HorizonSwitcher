# Daily: moves the pin to the newest Horizon Nightly that has an SDK release. When the mod fits it
# (tools/bump_horizon.py: every target still patchable, unchanged signatures, selectors found), the
# new pin goes straight to master with the next patch version, its tag, and a release (release.yml).
# A target that is gone or changed changes nothing and opens an issue.
name: Bump Horizon

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: "A Horizon commit instead of the newest Nightly (optional)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: bump-horizon
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Find the Nightly and update the pins
        id: bump
        run: |
          if [ -n "${{ inputs.revision }}" ]; then which="--revision ${{ inputs.revision }}"; else which="--latest"; fi
          set +e
          python3 tools/bump_horizon.py $which > report.json
          status=$?
          set -e
          cat report.json
          {
            echo "changed=$(python3 -c 'import json; print(str(json.load(open("report.json")).get("changed", False)).lower())')"
            echo "new=$(python3 -c 'import json; print(json.load(open("report.json"))["new"])')"
            echo "tag=$(python3 -c 'import json; print(json.load(open("report.json"))["tag"] or "")')"
          } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Test on the new pin
        if: steps.bump.outputs.changed == 'true'
        run: |
          cargo test --locked
          python3 tools/verify.py

      - name: Commit to master and tag
        id: push
        if: steps.bump.outputs.changed == 'true'
        run: |
          version=$(python3 tools/bump_version.py)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horizon_switcher
          git commit -q -m "Pin Horizon ${{ steps.bump.outputs.tag || steps.bump.outputs.new }}, v$version" \
            -m "$(cat report.json)"
          # master may have moved meanwhile: put the bump on top (the pin lines are
          # only ever changed by this workflow, so this doesn't conflict in practice).
          git pull -q --rebase origin master
          git tag "v$version"
          git push origin HEAD:master "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Report a mod that no longer fits
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Horizon Switcher doesn't fit the newest Horizon"
          body=$(printf 'The [bump run](%s/%s/actions/runs/%s) failed; master is unchanged.\n\n```json\n%s\n```\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat report.json 2>/dev/null || echo '{}')")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi

  # A tag pushed with the workflow's token starts no workflow, so the release is called from here.
  release:
    needs: bump
    if: needs.bump.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
      verified: true
    permissions:
      contents: write
